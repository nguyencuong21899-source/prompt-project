<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Duyệt prompt · Prompt CNC</title><style>body{font:15px Arial,sans-serif;color:#22324c;background:#f6f8fc;margin:0}header{background:white;border-bottom:1px solid #e4e9f1;padding:20px max(24px,calc((100vw - 900px)/2))}h1{margin:0;font-size:23px}main{max-width:900px;margin:28px auto;padding:0 20px}input,textarea{padding:11px;border:1px solid #cbd5e2;border-radius:7px;font:inherit}input{min-width:240px}button{border:0;border-radius:7px;background:#4387f5;color:white;padding:11px 15px;cursor:pointer}button.secondary{background:#e9eff9;color:#3d587b}button.danger{background:#aa514a}article{background:white;border:1px solid #e4e9f1;border-radius:10px;margin:15px 0;padding:20px}article h2{font-size:17px;margin:0 0 8px}small{color:#8290a5}.actions{display:flex;gap:9px;align-items:center;margin-top:15px}p{line-height:1.5}a{color:#397be7}#message{color:#ab4d42}</style></head><body><header><h1>Prompt CNC · Duyệt đề xuất</h1></header><main><p>Nhập mật khẩu quản trị để xem đề xuất. Nội dung chi tiết mở trong trang lưu trữ trước khi xuất bản.</p><input id="password" type="password" placeholder="Mật khẩu quản trị" autocomplete="off"> <button id="load">Xem đề xuất</button><p id="message" role="status"></p><div id="list"></div></main><script>
const $=id=>document.getElementById(id);let password='';
async function api(path,options={}){const response=await fetch(path,{...options,headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'}});const data=await response.json();if(!response.ok)throw Error(data.error||'Yêu cầu thất bại');return data;}
async function load(){password=$('password').value;$('message').textContent='Đang tải...';try{const prs=await api('/api/admin/proposals');$('list').replaceChildren();for(const p of prs){const card=document.createElement('article'),title=document.createElement('h2'),date=document.createElement('small'),link=document.createElement('a'),actions=document.createElement('div'),approve=document.createElement('button'),reject=document.createElement('button');title.textContent=p.title;date.textContent='Gửi '+new Date(p.createdAt).toLocaleString('vi-VN')+' · PR #'+p.number;link.textContent='Xem nội dung và thay đổi ↗';link.href=p.url;link.target='_blank';link.rel='noopener noreferrer';actions.className='actions';approve.textContent='Duyệt và xuất bản';reject.textContent='Từ chối';reject.className='danger';approve.onclick=()=>decide(p,'approve');reject.onclick=()=>decide(p,'reject');actions.append(approve,reject);card.append(title,date,document.createElement('p'),link,actions);$('list').append(card);} $('message').textContent=prs.length?prs.length+' đề xuất đang chờ':'Không có đề xuất chờ duyệt.';}catch(e){$('message').textContent=e.message;}}
async function decide(pr,action){let reason='';if(action==='reject'){reason=prompt('Lý do từ chối:')||'';if(!reason.trim())return;}else if(!confirm('Anh đã đọc nội dung và muốn xuất bản đề xuất #'+pr.number+'?'))return;try{await api('/api/admin/proposals/'+pr.number+'/'+action,{method:'POST',body:JSON.stringify({headSha:pr.headSha,reason})});await load();}catch(e){$('message').textContent=e.message;}}
$('load').onclick=load;
</script></body></html>
